<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HWA Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="w-[620px] max-h-[620px] overflow-x-hidden overflow-y-auto bg-slate-50 p-4 font-sans text-sm text-slate-900 min-[800px]:mx-auto min-[800px]:max-h-none min-[800px]:w-full min-[800px]:max-w-6xl min-[800px]:overflow-visible">
  <header class="rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-sm">
    <div class="flex items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-2">
        <h1 class="truncate text-lg font-semibold tracking-tight">HWA Helper</h1>
        <button id="open-tab" type="button" title="Mở HWA Helper trong tab mới" aria-label="Mở HWA Helper trong tab mới" class="inline-flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-md text-slate-500 hover:bg-slate-100 hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false"><path d="M14 4h6v6m0-6-9 9M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="flex shrink-0 items-center gap-2" aria-label="Năng lượng hiện tại">
        <span title="Energy (snapshot gần nhất)" aria-label="Energy" class="inline-flex items-center gap-1 rounded-full bg-amber-50 px-2.5 py-1 font-semibold text-amber-800 ring-1 ring-amber-200">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 10-13h-7V2Z" fill="currentColor"/></svg><span id="energy-value">—</span>
        </span>
        <span title="World Energy (snapshot gần nhất)" aria-label="World Energy" class="inline-flex items-center gap-1 rounded-full bg-sky-50 px-2.5 py-1 font-semibold text-sky-800 ring-1 ring-sky-200">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9c-3-3-4-6-4-9s1-6 4-9Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span id="world-energy-value">—</span>
        </span>
      </div>
    </div>
    <p class="mt-1 text-xs text-slate-500">Phiên bản extension: <strong id="version"></strong></p>
  </header>

  <nav id="tabs" role="tablist" aria-label="Dữ liệu game" class="mt-3 flex gap-1 overflow-x-auto border-b border-slate-200">
    <button type="button" role="tab" data-tab="heroes" aria-selected="true" class="cursor-pointer whitespace-nowrap rounded-t-lg border-b-2 border-transparent px-3 py-2 font-medium text-slate-600 hover:bg-white aria-selected:border-blue-600 aria-selected:bg-white aria-selected:text-blue-700">Heroes</button>
    <button type="button" role="tab" data-tab="items" aria-selected="false" class="cursor-pointer whitespace-nowrap rounded-t-lg border-b-2 border-transparent px-3 py-2 font-medium text-slate-600 hover:bg-white aria-selected:border-blue-600 aria-selected:bg-white aria-selected:text-blue-700">Items</button>
    <button type="button" role="tab" data-tab="titans" aria-selected="false" class="cursor-pointer whitespace-nowrap rounded-t-lg border-b-2 border-transparent px-3 py-2 font-medium text-slate-600 hover:bg-white aria-selected:border-blue-600 aria-selected:bg-white aria-selected:text-blue-700">Titans</button>
    <button type="button" role="tab" data-tab="teams" aria-selected="false" class="cursor-pointer whitespace-nowrap rounded-t-lg border-b-2 border-transparent px-3 py-2 font-medium text-slate-600 hover:bg-white aria-selected:border-blue-600 aria-selected:bg-white aria-selected:text-blue-700">Teams</button>
    <button type="button" role="tab" data-tab="other" aria-selected="false" class="cursor-pointer whitespace-nowrap rounded-t-lg border-b-2 border-transparent px-3 py-2 font-medium text-slate-600 hover:bg-white aria-selected:border-blue-600 aria-selected:bg-white aria-selected:text-blue-700">Khác</button>
    <button type="button" role="tab" data-tab="log" aria-selected="false" class="cursor-pointer whitespace-nowrap rounded-t-lg border-b-2 border-transparent px-3 py-2 font-medium text-slate-600 hover:bg-white aria-selected:border-blue-600 aria-selected:bg-white aria-selected:text-blue-700">Log</button>
    <button type="button" role="tab" data-tab="config" aria-selected="false" title="Cấu hình" aria-label="Cấu hình" class="ml-auto inline-flex cursor-pointer items-center rounded-t-lg border-b-2 border-transparent px-3 py-2 text-slate-600 hover:bg-white aria-selected:border-blue-600 aria-selected:bg-white aria-selected:text-blue-700">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 2h4l.5 2.2 1.9.8 1.9-1.2 2.8 2.8-1.2 1.9.8 1.9L23 10v4l-2.3.5-.8 1.9 1.2 1.9-2.8 2.8-1.9-1.2-1.9.8L14 23h-4l-.5-2.3-1.9-.8-1.9 1.2-2.8-2.8 1.2-1.9-.8-1.9L1 14v-4l2.2-.5.8-1.9-1.2-1.9 2.8-2.8 1.9 1.2 1.9-.8L10 2Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </nav>

  <div id="toolbar" class="mt-3 flex items-end gap-2">
    <div class="min-w-0 flex-1">
      <label id="search-label" for="search" class="mb-1 block text-xs font-medium text-slate-600">Lọc theo ID, tên hoặc nhóm</label>
      <input id="search" type="search" placeholder="Nhập ID, tên hoặc nhóm" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
    </div>
    <div id="item-group-filter" hidden class="w-40 shrink-0">
      <label for="item-group" class="mb-1 block text-xs font-medium text-slate-600">Nhóm items</label>
      <select id="item-group" class="w-full rounded-lg border border-slate-300 bg-white px-2 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"><option value="">Tất cả nhóm</option></select>
    </div>
    <div id="log-sort-wrap" hidden class="w-36 shrink-0">
      <label for="log-sort" class="mb-1 block text-xs font-medium text-slate-600">Sắp xếp log</label>
      <select id="log-sort" class="w-full rounded-lg border border-slate-300 bg-white px-2 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"><option value="newest">Mới nhất</option><option value="oldest">Cũ nhất</option><option value="duration-desc">Lâu nhất</option><option value="duration-asc">Nhanh nhất</option></select>
    </div>
    <button id="record-toggle" type="button" hidden class="cursor-pointer rounded-lg border border-red-300 bg-red-50 px-3 py-2 font-medium text-red-800 hover:bg-red-100">Record</button>
    <button id="export" type="button" hidden class="cursor-pointer rounded-lg border border-slate-300 bg-white px-3 py-2 font-medium text-slate-700 hover:bg-slate-100">Xuất JSON</button>
  </div>
  <p id="status" role="status" class="my-2 min-h-5 text-xs text-slate-500"></p>

  <section id="settings-panel" hidden class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm" aria-label="Cấu hình">
    <h2 class="text-base font-semibold">Cấu hình</h2>
    <p class="mt-1 text-xs text-slate-500">Theo dõi API cập nhật cache thụ động. Record/Stop nằm trong tab Log.</p>
    <div class="mt-4 space-y-3">
      <label class="flex cursor-pointer items-center gap-3 rounded-lg border border-slate-200 px-3 py-2"><input id="intercept-enabled" type="checkbox" checked class="size-4 accent-blue-600"> Theo dõi API</label>
    </div>
    <div class="mt-5 flex gap-2 border-t border-slate-200 pt-4">
      <button id="clear-cache" type="button" class="cursor-pointer rounded-lg border border-amber-300 bg-amber-50 px-3 py-2 font-medium text-amber-900 hover:bg-amber-100">Xóa cache</button>
      <button id="clear" type="button" class="cursor-pointer rounded-lg border border-red-300 bg-red-50 px-3 py-2 font-medium text-red-800 hover:bg-red-100">Xóa log</button>
    </div>
  </section>

  <div id="view" role="tabpanel" aria-live="polite" class="max-h-[360px] overflow-auto rounded-xl border border-slate-200 bg-white shadow-sm min-[800px]:max-h-none"></div>
  <script src="tracking-filter.js"></script>
  <script src="export-name.js"></script>
  <script src="data-names.js"></script>
  <script src="name-map.js"></script>
  <script src="popup-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
