apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hwa-control-panel
  labels:
    app: hwa-control-panel
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "hwa-control-panel"
spec:
  rules:
    - host: hwa-cp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hwa-control-panel
                port:
                  number: 80
  tls:
    - hosts:
        - hwa-cp.example.com
      secretName: hwa-control-panel-tls
